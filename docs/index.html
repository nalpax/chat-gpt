async function api(url,method='GET',data){
 if(url==='/api/config')return {realAccountsEnabled:false};

  const rows=[['Сайт для нового бренда','NØRD',240000,'new',8,'Интернет-магазин предметов интерьера. Каталог до 50 товаров и адаптивный дизайн.'],['Айдентика кофейни','SLOW Coffee',85000,'new',12,'Логотип, цветовая палитра и упаковка.'],['Редизайн личного кабинета','Orbit',180000,'progress',5,'Пользовательские сценарии и дизайн 12 экранов.'],['Лендинг летней коллекции','Linen',120000,'review',3,'Арт-дирекшн и адаптивный лендинг. Два раунда правок.'],['Дизайн-система','Capsule',320000,'won',20,'Компоненты, токены и документация.'],['Сайт архитектурного бюро','ARCH / 01',210000,'progress',15,'Портфолио, страница команды и форма обращения.']];
  localData={workspace:{id:demoID(),name:'Forma Studio',demo:1},events:[{text:'Открыто браузерное демо',created:stamp()}],projects:rows.map(([title,client,amount,status,days,description])=>({id:demoID(),title,client,amount,status,description,email:'',due:new Date(Date.now()+days*86400000).toISOString().slice(0,10),created:stamp(),share:null,decision:null}))};persist();return {ok:true};
 }

 if(url==='/api/workspace')return structuredClone(localData);
 if(url==='/api/projects'&&method==='POST'){
  const p={...data,id:demoID(),status:'new',share:null,decision:null,created:stamp()};localData.projects.unshift(p);logEvent('Новый проект: «'+p.title+'»');persist();return {id:p.id};
 }
 const pub=/^\/api\/public\/([a-f0-9]+)(\/approve)?$/.exec(url);
 if(pub){const p=localData.projects.find(x=>x.share===pub[1]);if(!p)localError(404,'Демо-ссылка не найдена. Она доступна только в том же браузере, где создана.');if(method==='GET')return {...p,studio:localData.workspace.name};if(method==='POST'&&pub[2]){if(p.decision||p.status!=='review')localError(409,'Предложение уже согласовано или отозвано');p.decision=stamp();p.status='won';logEvent(p.client+' согласовал(а) «'+p.title+'»');persist();return {ok:true};}}
 const m=/^\/api\/projects\/([a-f0-9]+)(\/share)?$/.exec(url);
 if(m){const p=localData.projects.find(x=>x.id===m[1]);if(!p)localError(404,'Проект не найден');if(method==='DELETE'){localData.projects=localData.projects.filter(x=>x!==p);logEvent('Проект удалён');persist();return {ok:true};}if(p.decision)localError(409,'Условия уже приняты');if(method==='PATCH'){Object.assign(p,data,{share:null});logEvent('Обновлён проект «'+p.title+'»');persist();return {ok:true};}if(method==='POST'&&m[2]){if(p.status==='won')localError(409,'Проект уже согласован');p.share=p.share||demoID();p.status='review';logEvent('Демо-предложение готово к просмотру');persist();return {share:p.share};}}
 localError(404,'Эта функция недоступна в браузерном демо');

function modal(html){previousFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close-btn" aria-label="Закрыть">×</button>${html}</section></div>`;$('.close-btn').onclick=closeModal;$('.overlay').onclick=e=>{if(e.target===e.currentTarget)closeModal();};setTimeout(()=>$('.modal input, .modal button:not(.close-btn)')?.focus(),0);}
function closeModal(){$('#modal-root').innerHTML='';if(state.workspace)render();previousFocus?.focus();}
document.addEventListener('keydown',e=>{const m=$('.modal');if(!m)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const list=[...m.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled&&!x.hidden);const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
function authModal(mode){if(!config.realAccountsEnabled){modal(`<h2 id="modal-title">Сначала — безопасный запуск</h2><p>Это браузерное демо без сервера. Данные сохраняются только в этом браузере. Регистрации и отправки сообщений здесь нет.</p><p>Используйте вымышленные данные. Клиентские демо-ссылки работают только в том же браузере. Для реальной работы потребуется отдельно размещённая серверная версия.</p><button class="btn primary full" id="safe-demo">Открыть демо</button>`);$('#safe-demo').onclick=async()=>{closeModal();await startDemo();};return;}const signup=mode==='register';modal(`<span class="modal-kicker">ВАШЕ НОВОЕ РАБОЧЕЕ МЕСТО</span><h2 id="modal-title">${signup?'Начнём с чистого листа':'С возвращением'}</h2><p>${signup?'Создайте пространство для своих проектов.':'Войдите в своё рабочее пространство.'}</p><form id="auth-form">${signup?'<label>Название команды<input name="name" placeholder="Например, Forma Studio" maxlength="100" required autocomplete="organization"></label>':''}<label>Рабочий email<input name="email" type="email" placeholder="you@studio.ru" required autocomplete="email" maxlength="254"></label><label>Пароль<input name="password" type="password" minlength="10" maxlength="128" placeholder="Не менее 10 символов" required autocomplete="${signup?'new-password':'current-password'}"></label><p class="form-error" role="alert"></p><button class="btn primary full" type="submit">${signup?'Создать пространство':'Войти'} ${icon('arrow')}</button></form><button class="text-btn auth-switch">${signup?'Уже есть аккаунт? Войти':'Нет аккаунта? Создать пространство'}</button><small class="modal-footnote">MVP: один аккаунт на пространство. Восстановление пароля и приглашения пока не подключены.</small>`);$('.auth-switch').onclick=()=>authModal(signup?'login':'register');$('#auth-form').onsubmit=async e=>{e.preventDefault();const btn=$('button[type=submit]',e.target);btn.disabled=true;try{await api(signup?'/api/register':'/api/login','POST',Object.fromEntries function clientsView(){const clients=new Map();state.projects.forEach(p=>{const c=clients.get(p.client)||{count:0,amount:0};c.count++;c.amount+=p.amount;clients.set(p.client,c);});return `<section class="clients-grid">${[...clients].map(([name,c])=>`<article class="client-card"><span class="client-initial">${esc(name.slice(0,2))}</span><h3>${esc(name)}</h3><p>${c.count} проектов · ${money(c.amount)}</p><button class="text-btn client-open" data-client="${esc(name)}">Посмотреть проекты ${icon('arrow')}</button></article>`).join('')||'<div class="empty">Здесь появятся клиенты ваших проектов.</div>'}</section>`;}
function renderProjects(){const list=state.projects.filter(p=>(state.filter==='all'||p.status===state.filter)&&(state.view!=='proposals'||['review','won'].includes(p.status))&&`${p.title} ${p.client}`.toLowerCase().includes(state.search.toLowerCase()));$('#project-list').innerHTML=`<div class="table-wrap"><table><thead><tr><th>ПРОЕКТ / КЛИЕНТ</th><th>СТАТУС</th><th>БЮДЖЕТ</th><th>СРОК</th><th aria-label="Действия"></th></tr></thead><tbody>${list.map((p,i)=>`<tr><td><button class="project-title" data-open="${p.id}"><span class="project-avatar tone-${state.projects.indexOf(p)%5}">${esc(p.client.slice(0,2))}</span><span><strong>${esc(p.title)}</strong><small>${esc(p.client)}</small></span></button></td><td><span class="pill ${p.status}"><i></i>${labels[p.status]}</span></td><td class="amount">${money(p.amount)}</td><td class="due">${icon('clock')}${date(p.due)}</td><td><button class="row-open icon-btn" data-open="${p.id}" aria-label="Открыть ${esc(p.title)}">${icon('chevron')}</button></td></tr>`).join('')}</tbody></table></div>${!list.length?`<div class="empty"><span>↗</span><h3>${state.search?'Ничего не нашлось':'Здесь начинается следующий проект'}</h3><p>${state.search?'Попробуйте другое название или имя клиента.':'Добавьте запрос клиента — остальное сложится по шагам.'}</p>${!state.search?'<button class="btn primary" id="empty-new">Создать проект</button>':''}</div>`:''}<div class="table-footer"><span>${list.length} из ${state.projects.length} проектов</span><span>Каждая идея заслуживает хорошего начала ↗</span></div>`;document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>projectModal(el.dataset.open));$('#empty-new')?.addEventListener('click',()=>projectModal());}

">'+icon('link')+' Создать ссылку клиенту</button>':''}<button class="text-btn danger" id="delete-project">Удалить проект</button></div><div id="share-result"></div><small class="modal-footnote">${locked?'Согласование фиксирует намерение клиента и не заменяет юридический договор.':'Демо-ссылка доступна только в этом браузере, не отправляйте её настоящим клиентам. Сначала сохраните изменения. При редактировании старая ссылка отзывается.'}</small>`:''}`);

 $('#share-project')?.addEventListener('click',async e=>{const form=$('#project-form');const current=Object.fromEntries(new FormData(form));if(['title','client','email','description','amount','due','status'].some(k=>String(current[k]??'')!==String(p[k]??''))){toast('Сначала сохраните изменения');return;}const button=e.currentTarget;button.disabled=true;try{const r=await api('/api/projects/'+p.id+'/share','POST',{});const link=location.href.split('#')[0]+'#proposal/'+r.share;$('#share-result').innerHTML=`<label>Демо-ссылка — работает только в этом браузере<input id="share-link" value="${esc(link)}" readonly></label><div class="modal-actions"><button class="btn" id="copy-link">Скопировать</button><a class="text-btn" target="_blank" rel="noopener" href="${esc(link)}">Открыть предложение ↗</a></div>`;$('#copy-link').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('Ссылка скопирована');}catch{$('#share-link').select();toast('Выделили ссылку. Скопируйте её вручную.');}};Object.assign(state,await api('/api/workspace'));toast('Предложение ожидает решения клиента');}catch(err){toast(err.message);}finally{button.disabled=false;}});
}
function exportCSV(){const safe=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const rows=[['Проект','Клиент','Email','Бюджет RUB','Статус','Срок'],...state.projects.map(p=>[p.title,p.client,p.email,p.amount,labels[p.status],p.due])];const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(safe).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='brief-projects.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Экспорт готов');}
async function proposal(){try{const token=location.hash.split('/')[1];const p=await api('/api/public/'+encodeURIComponent(token));app.innerHTML=`<div class="proposal-page"><header>${logo()}<span>Предложение для ${esc(p.client)}</span></header><main class="proposal-card"><span class="eyebrow">${esc(p.studio)} → ${esc(p.client)}</span><h1>${esc(p.title)}</h1><p class="proposal-subtitle">Хорошая работа начинается с общего понимания.</p><div class="proposal-metrics"><div><small>БЮДЖЕТ ПРОЕКТА</small><strong>${money(p.amount)}</strong></div><div><small>ПЛАНОВАЯ ДАТА</small><strong>${date(p.due)}</strong></div></div><h2>Что сделаем</h2><p class="proposal-description">${esc(p.description||'Уточните состав работ с исполнителем перед согласованием.')}</p>${p.decision?'<div class="proposal-accepted">'+icon('check')+' Предложение принято '+new Date(p.decision).toLocaleDateString('ru-RU')+'. Спасибо за доверие!</div>':p.status==='review'?'<div class="proposal-cta"><p>Всё подходит? Дайте команде знать, что можно начинать.</p><label class="consent"><input type="checkbox" id="consent"> Я ознакомился(ась) с условиями и принимаю предложение от имени клиента.</label><button class="btn primary large full" id="approve" disabled>Принять предложение '+icon('check')+'</button></div>':'<p class="accepted-note">Предложение сейчас не ожидает согласования. Свяжитесь с исполнителем.</p>'}<small class="modal-footnote">Согласование фиксирует ваше решение, не списывает деньги и не заменяет подписанный договор. Не передавайте эту ссылку третьим лицам.</small></main><footer>Сделано в Брифе · Меньше переписки, больше дела.</footer></div>`;$('#consent')?.addEventListener('change',e=>$('#approve').disabled=!e.target.checked);$('#approve')?.addEventListener('click',async e=>{e.currentTarget.disabled=true;try{await api('/api/public/'+token+'/approve','POST',{});await proposal();}catch(err){toast(err.message);e.currentTarget.disabled=false;}});}catch(e){app.innerHTML=`<div class="not-found">${logo()}<h1>Предложение недоступно</h1><p>${esc(e.message)}</p><a class="btn" href="#">На главную</a></div>`;}}
async function boot(){if(location.hash.startsWith('#proposal/'))return proposal();try{config=await api('/api/config');await refresh();}catch(e){if(e.status===401)landing();else{app.innerHTML='<div class="not-found"><h1>Не удалось загрузить пространство</h1><p>Проверьте подключение и обновите страницу.</p><button class="btn" id="retry">Попробовать ещё раз</button></div>';$('#retry').onclick=boot;}}}
boot();
</script></body></html>
